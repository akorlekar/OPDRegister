<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OPD Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2230; --ink-soft:#3A4358; --paper:#F6F3EC; --raised:#FFFFFF;
    --line:#DCD6C4; --line-soft:#EAE5D6; --green:#2F6F4E; --green-bg:#E7F1EA;
    --red:#A83A32; --red-bg:#F7E9E7; --mustard:#C98A2C; --muted:#79725F; --radius:3px;
    --sans:'IBM Plex Sans','Segoe UI',Roboto,Arial,sans-serif;
    --mono:'IBM Plex Mono',Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;}

  /* ===== Login / setup ===== */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);padding:36px 32px;width:100%;max-width:400px;position:relative;}
  .login-card::before{content:"";position:absolute;top:0;left:24px;right:24px;height:3px;
    background:repeating-linear-gradient(90deg,var(--mustard) 0 10px,transparent 10px 16px);}
  .register-title{font-family:var(--mono);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:0 0 2px;}
  .clinic-name{font-family:var(--mono);font-weight:700;font-size:25px;margin:0 0 22px;letter-spacing:-.01em;word-break:break-word;}
  .setup-note{font-size:13px;color:var(--ink-soft);margin:0 0 6px;line-height:1.5;}
  .login-error{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}

  label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 5px;}
  select,input,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#FCFBF7;font-family:var(--sans);font-size:14px;color:var(--ink);}
  textarea{resize:vertical;}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--mustard);outline-offset:1px;background:#fff;}
  input[readonly]{background:#F1EEE3;color:var(--ink-soft);}

  .btn{font-family:var(--mono);font-weight:600;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--radius);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
  .btn:hover{background:var(--ink-soft);}
  .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-outline:hover{border-color:var(--ink);background:transparent;}
  .btn-green{background:var(--green);border-color:var(--green);}
  .btn-green:hover{background:#265a40;}
  .btn-danger{background:var(--red);border-color:var(--red);}
  .btn-danger:hover{background:#8a2f29;}
  .btn-sm{padding:6px 10px;font-size:11px;}
  .btn-block{width:100%;margin-top:20px;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn:disabled:hover{background:inherit;}

  /* ===== App shell ===== */
  #app-screen{display:none;min-height:100vh;}
  .topbar{background:var(--ink);color:#EFEBDD;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .topbar .brand{font-family:var(--mono);font-weight:700;letter-spacing:.03em;font-size:15px;}
  .topbar .who{font-size:12.5px;color:#B9B39E;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .topbar .who b{color:#EFEBDD;}
  .logout-link{color:#D9A25A;cursor:pointer;text-decoration:underline;font-weight:600;}

  .menubar{display:flex;background:#2A3347;padding:0 14px;overflow-x:auto;}
  .menubar button{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#C9C3AE;background:none;border:none;padding:12px 16px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
  .menubar button:hover{color:#fff;}
  .menubar button.active{color:#fff;border-bottom-color:var(--mustard);}

  .tabs{display:flex;background:#EFEADC;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto;}
  .tab{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:12px 16px;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--ink);border-bottom-color:var(--mustard);background:var(--paper);}

  .content{padding:20px;max-width:1280px;margin:0 auto;}
  .card{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .card h2{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px;padding-bottom:9px;border-bottom:1px dashed var(--line);color:var(--ink-soft);}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px;}
  .grid.g4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:860px){.grid,.grid.g4{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.grid,.grid.g4{grid-template-columns:1fr;}}
  .full{grid-column:1/-1;}
  .sep{grid-column:1/-1;height:1px;background:var(--line-soft);margin:14px 0 2px;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);}
  .hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5;}
  .findrow{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;}
  .findrow > div{flex:1;min-width:220px;}
  .findrow .outstanding{flex:0 0 auto;min-width:0;font-size:13px;padding-bottom:9px;}
  .findrow .outstanding b{font-family:var(--mono);font-size:16px;color:var(--red);}

  .tablewrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px 9px;border-bottom:1px solid var(--ink);white-space:nowrap;}
  tbody td{padding:8px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:hover{background:#FBF9F3;}
  tr.clickable{cursor:pointer;}
  tr.selected{background:#FFF4DC !important;}
  .num{text-align:right;font-family:var(--mono);}
  td input.cell{width:84px;padding:6px 7px;font-size:12.5px;text-align:right;font-family:var(--mono);}
  .stamp{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;display:inline-block;border:1.5px solid;}
  .stamp.paid{color:var(--green);border-color:var(--green);background:var(--green-bg);}
  .stamp.due{color:var(--red);border-color:var(--red);background:var(--red-bg);}
  .empty-state{text-align:center;padding:36px 20px;color:var(--muted);font-size:13.5px;}
  .empty-state b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px;font-family:var(--mono);}

  .pills{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .pill{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);padding:11px 18px;min-width:140px;}
  .pill .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--mono);}
  .pill .val{font-size:20px;font-weight:700;font-family:var(--mono);margin-top:3px;}
  .pill .val.red{color:var(--red);} .pill .val.green{color:var(--green);}
  .inline{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;}
  .inline > div{min-width:150px;}
  .staff-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
  .staff-row .nm{flex:1;min-width:140px;font-weight:600;}
  .staff-row input{width:110px;padding:6px 8px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--radius);font-size:13px;font-family:var(--mono);box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:50;opacity:0;transform:translateY(8px);transition:all .25s ease;pointer-events:none;max-width:90vw;}
  .toast.show{opacity:1;transform:translateY(0);}
  .fatal{max-width:560px;margin:80px auto;padding:24px;background:var(--red-bg);border:1px solid var(--red);border-radius:var(--radius);font-size:14px;line-height:1.6;}
</style>
</head>
<body>

<!-- ============ LOGIN / FIRST-TIME SETUP ============ -->
<div id="login-screen">
  <div class="login-card">
    <p class="register-title">Reception Desk</p>
    <h1 class="clinic-name" id="lg-title">OPD Register</h1>

    <div id="login-mode">
      <label>Staff Name</label>
      <select id="login-select"></select>
      <label>PIN</label>
      <input type="password" id="login-pin" maxlength="6" inputmode="numeric" data-pin autocomplete="off" placeholder="4-6 digit PIN">
      <div class="login-error" id="login-error"></div>
      <button class="btn btn-block" id="login-btn">Log In</button>
    </div>

    <div id="setup-mode" style="display:none;">
      <p class="setup-note">Welcome. Set up this register by creating the first login. This person becomes the admin and can add other staff later.</p>
      <label>Clinic Name (optional)</label>
      <input type="text" id="su-clinic" placeholder="Shown at the top of the app">
      <label>Your Name</label>
      <input type="text" id="su-name">
      <label>Choose PIN (4-6 digits)</label>
      <input type="password" id="su-pin" maxlength="6" inputmode="numeric" data-pin autocomplete="off">
      <label>Confirm PIN</label>
      <input type="password" id="su-pin2" maxlength="6" inputmode="numeric" data-pin autocomplete="off">
      <div class="login-error" id="su-error"></div>
      <button class="btn btn-block" id="su-btn">Create and Start</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app-screen">
  <div class="topbar">
    <div class="brand" id="brand">OPD Register</div>
    <div class="who">Login User: <b id="who-name">-</b> <span id="clock"></span> <span class="logout-link" id="logout-btn">Log out</span></div>
  </div>
  <div class="menubar">
    <button data-menu="reception">Reception Counter</button>
    <button data-menu="reports">Reports</button>
    <button data-menu="settings">Settings &amp; Backup</button>
    <button data-menu="exit">Exit &amp; Backup</button>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab" data-tab="new">For New Patient</div>
    <div class="tab" data-tab="session">Session Generated List</div>
    <div class="tab" data-tab="revisit">Revisit Patient List</div>
    <div class="tab" data-tab="today">Show Today's Cash</div>
    <div class="tab" data-tab="pending">Pending Payments</div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   OPD REGISTER
   Data model
     patient: { id, opdNo, regDate, name, mobNo, age, gender, address, city,
                refBy, refContact, treatment, status, diagnosis, patientHistory,
                createdBy, visits:[ visit ] }
     visit:   { id, date, dayNo, consult, electrode, treatment, additional,
                payments:[{date,cash,online,user}], user, ts }
   Money paid is a log of payments, so "Today's Cash" always shows what was
   actually received on that day, even when an old balance is cleared later.
   ===================================================================== */
const LS_KEY = 'opd-register-data-v2';
const LS_OLD = 'opd-register-data-v1';

let db = {settings:{clinic:''}, staff:[], patients:[]};
let loadFailed = false;
let currentUser = null, sessionStart = '';
let section = 'reception', tab = 'new';
let editingId = null, revisitFor = null;
let findQ = '', pendQ = '', rvQ = '', rvFilter = 'active', tcDate = '';
let repFrom = '', repTo = '';

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = v => { const x = Number(v); return isFinite(x) ? x : 0; };
const money = v => n(v).toLocaleString('en-IN');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(d){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d||''); return m ? m[3]+'-'+m[2]+'-'+m[1] : (d||'-'); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- visit / patient maths ---------- */
const vTotal  = v => n(v.consult)+n(v.electrode)+n(v.treatment)+n(v.additional);
const vCash   = v => (v.payments||[]).reduce((s,x)=>s+n(x.cash),0);
const vOnline = v => (v.payments||[]).reduce((s,x)=>s+n(x.online),0);
const vBal    = v => vTotal(v)-vCash(v)-vOnline(v);
const lastVisit = p => p.visits[p.visits.length-1];
const pOut = p => p.visits.reduce((s,v)=>s+Math.max(0,vBal(v)),0);
function setPaid(v, cash, online){
  const dc = cash - vCash(v), dn = online - vOnline(v);
  if(dc !== 0 || dn !== 0) (v.payments = v.payments||[]).push({date:todayStr(), cash:dc, online:dn, user:currentUser});
}
function newVisit(f, date){
  const v = {id:uid(), date:date||todayStr(), dayNo:String(f.dayNo||'1'), consult:n(f.consult), electrode:n(f.electrode),
             treatment:n(f.treatment), additional:n(f.additional), payments:[], user:currentUser, ts:new Date().toISOString()};
  if(n(f.cash) || n(f.online)) v.payments.push({date:todayStr(), cash:n(f.cash), online:n(f.online), user:currentUser});
  return v;
}
function nextOpd(){ return db.patients.reduce((m,p)=>Math.max(m, parseInt(p.opdNo)||0), 0) + 1; }
function allPayments(){
  const out = [];
  db.patients.forEach(p => p.visits.forEach(v => (v.payments||[]).forEach(x => out.push({p, v, x}))));
  return out;
}

/* ---------- storage ---------- */
function normalize(d){
  d = d || {};
  d.settings = d.settings || {clinic:''};
  d.staff = (d.staff||[]).map((s,i)=>({name:String(s.name), pin:String(s.pin), admin: s.admin!==undefined ? !!s.admin : i===0}));
  if(d.staff.length && !d.staff.some(s=>s.admin)) d.staff[0].admin = true;
  d.patients = (d.patients||[]).map(p=>{
    if(!Array.isArray(p.visits)){            // older single-record format
      const date = p.regDate || todayStr(), cash = n(p.cashPay), online = n(p.onlinePay);
      p.visits = [{id:uid(), date, dayNo:String(p.dayNo||'1'), consult:n(p.consultCharges), electrode:n(p.electrode),
                   treatment:n(p.treatmentCharges), additional:0,
                   payments:(cash||online)?[{date, cash, online, user:p.loginUser||''}]:[], user:p.loginUser||'', ts:p.updatedAt||new Date().toISOString()}];
      ['consultCharges','electrode','treatmentCharges','cashPay','onlinePay','dayNo','loginUser','updatedAt'].forEach(k=>delete p[k]);
    }
    p.id = p.id || uid();
    return p;
  });
  return d;
}
function readRaw(k){
  try{ return window.desktopStore ? window.desktopStore.read() : localStorage.getItem(k); }catch(e){ return null; }
}
function loadDb(){
  let raw = readRaw(LS_KEY);
  if(!raw && !window.desktopStore){ try{ raw = localStorage.getItem(LS_OLD); }catch(e){} }
  if(!raw){ db = normalize({}); return; }
  try{ db = normalize(JSON.parse(raw)); }
  catch(e){ loadFailed = true; }
}
function saveDb(){
  if(loadFailed) return false;
  const payload = JSON.stringify({version:2, settings:db.settings, staff:db.staff, patients:db.patients, savedAt:new Date().toISOString()});
  try{
    if(window.desktopStore) window.desktopStore.write(payload); else localStorage.setItem(LS_KEY, payload);
    return true;
  }catch(e){ toast('Could not save. Disk full or storage blocked.'); return false; }
}

/* ---------- download helpers ---------- */
function downloadFile(name, text, type){
  const blob = new Blob([text], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
const csvCell = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
function visitsCSV(rows){
  const head = ['OPD No','Reg Date','Patient Name','Mobile','Age','Gender','Address','City','Referred By','Ref Contact','Treatment','Status',
                'Diagnosis','Patient History','Visit Date','Day No','Consultation','Electrode','Treatment Chgs','Additional','Total','Cash','Online','Balance','Entered By'];
  const lines = rows.map(({p,v}) => [p.opdNo,fmtDate(p.regDate),p.name,p.mobNo,p.age,p.gender,p.address,p.city,p.refBy,p.refContact,p.treatment,p.status,
      p.diagnosis,p.patientHistory,fmtDate(v.date),v.dayNo,n(v.consult),n(v.electrode),n(v.treatment),n(v.additional),vTotal(v),vCash(v),vOnline(v),vBal(v),v.user].map(csvCell).join(','));
  return '\ufeff' + [head.map(csvCell).join(',')].concat(lines).join('\r\n');
}
function allVisitRows(){
  const rows = [];
  db.patients.slice().sort((a,b)=>(parseInt(a.opdNo)||0)-(parseInt(b.opdNo)||0)).forEach(p => p.visits.forEach(v => rows.push({p,v})));
  return rows;
}
function exportCSV(){ downloadFile('opd-patients-'+todayStr()+'.csv', visitsCSV(allVisitRows()), 'text/csv;charset=utf-8'); toast('Excel (CSV) file saved'); }
function backupText(){ return JSON.stringify({version:2, settings:db.settings, staff:db.staff, patients:db.patients}, null, 2); }
function exportBackup(){ downloadFile('opd-backup-'+todayStr()+'.json', backupText(), 'application/json'); toast('Backup file saved'); }

/* ---------- login ---------- */
function brandName(){ return (db.settings.clinic||'').trim() || 'OPD Register'; }
function refreshBrand(){
  $('brand').textContent = brandName(); $('lg-title').textContent = brandName(); document.title = brandName();
}
function populateLogin(){
  $('login-select').innerHTML = db.staff.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
}
function showLoginOrSetup(){
  const first = db.staff.length === 0;
  $('setup-mode').style.display = first ? 'block' : 'none';
  $('login-mode').style.display = first ? 'none' : 'block';
  populateLogin(); refreshBrand();
}
function enterApp(user){
  currentUser = user; sessionStart = new Date().toISOString();
  section = 'reception'; tab = 'new'; editingId = null; revisitFor = null; findQ = ''; pendQ = ''; rvQ = '';
  $('login-screen').style.display = 'none'; $('app-screen').style.display = 'block';
  $('who-name').textContent = user; refreshBrand(); render();
}
function logout(){
  currentUser = null;
  $('app-screen').style.display = 'none'; $('login-screen').style.display = 'flex';
  $('login-pin').value = ''; $('login-error').textContent = '';
  showLoginOrSetup();
}
function doLogin(){
  const name = $('login-select').value, pin = $('login-pin').value.trim();
  const s = db.staff.find(x => x.name === name && x.pin === pin);
  if(!s){ $('login-error').textContent = 'Wrong PIN. Try again.'; return; }
  enterApp(s.name);
}
function doSetup(){
  const clinic = $('su-clinic').value.trim(), name = $('su-name').value.trim(), pin = $('su-pin').value.trim(), pin2 = $('su-pin2').value.trim();
  const err = $('su-error');
  if(!name){ err.textContent = 'Enter your name.'; return; }
  if(!/^\d{4,6}$/.test(pin)){ err.textContent = 'PIN must be 4 to 6 digits.'; return; }
  if(pin !== pin2){ err.textContent = 'The two PINs do not match.'; return; }
  db.settings.clinic = clinic; db.staff = [{name, pin, admin:true}];
  if(!saveDb()){ err.textContent = 'Could not save. Check disk space.'; return; }
  err.textContent = '';
  enterApp(name);
}

/* ---------- datalist ---------- */
function dl(id, vals){
  const u = [...new Set(vals.map(v=>String(v||'').trim()).filter(Boolean))].sort();
  return `<datalist id="${id}">${u.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
}

/* =====================================================================
   VIEW: FOR NEW PATIENT
   ===================================================================== */
function renderNew(){
  const p = editingId ? db.patients.find(x=>x.id===editingId) : null;
  const lv = p ? lastVisit(p) : null;
  const prev = p && p.visits.length > 1 ? p.visits[p.visits.length-2] : null;
  const d = p ? {
    opdNo:p.opdNo, regDate:p.regDate, name:p.name, address:p.address, mobNo:p.mobNo, city:p.city, gender:p.gender, age:p.age,
    refBy:p.refBy, refContact:p.refContact, treatment:p.treatment, status:p.status||'New', dayNo:lv.dayNo,
    diagnosis:p.diagnosis, patientHistory:p.patientHistory,
    consult:lv.consult||'', electrode:lv.electrode||'', treat:lv.treatment||'', additional:lv.additional||'',
    cash:vCash(lv)||'', online:vOnline(lv)||'', lastChg: prev ? vTotal(prev) : ''
  } : {
    opdNo:nextOpd(), regDate:todayStr(), name:'', address:'', mobNo:'', city:'', gender:'', age:'', refBy:'', refContact:'', treatment:'',
    status:'New', dayNo:'1', diagnosis:'', patientHistory:'', consult:'', electrode:'', treat:'', additional:'', cash:'', online:'', lastChg:''
  };
  const sel = (cur, opts) => opts.map(o=>`<option ${cur===o?'selected':''}>${o}</option>`).join('');
  return `
  ${dl('dl-addr', db.patients.map(x=>x.address))}${dl('dl-city', db.patients.map(x=>x.city))}

function matchPatient(p, q){
  q = (q||'').trim().toLowerCase();
  if(!q) return true;
  return (p.name||'').toLowerCase().includes(q) || (p.mobNo||'').includes(q) || String(p.opdNo).toLowerCase() === q;
}
function findRows(q){
  const all = db.patients.filter(p=>matchPatient(p,q)).sort((a,b)=>(parseInt(b.opdNo)||0)-(parseInt(a.opdNo)||0));
  if(!all.length) return `<tr><td colspan="10"><div class="empty-state"><b>No patients found</b>${db.patients.length?'Try a different search.':'Saved patients will appear here.'}</div></td></tr>`;
  const rows = all.slice(0,200).map(p=>{
    const b = pOut(p);
    return `<tr class="clickable ${p.id===editingId?'selected':''}" data-act="load" data-id="${esc(p.id)}">
      <td>${esc(p.opdNo)}</td><td>${fmtDate(p.regDate)}</td><td>${esc(p.name)}</td><td>${esc(p.treatment)||'-'}</td><td>${esc(p.refBy)||'-'}</td>
      <td>${esc(p.mobNo)||'-'}</td><td>${esc(p.address)||'-'}</td><td>${esc(p.city)||'-'}</td><td>${esc(p.age)||'-'}</td>
      <td class="num">${b>0?`<span class="stamp due">${money(b)}</span>`:`<span class="stamp paid">Paid</span>`}</td></tr>`;
  }).join('');
  return rows + (all.length>200 ? `<tr><td colspan="10" class="hint">Showing the latest 200 of ${all.length}. Type in the search box to narrow down.</td></tr>` : '');
}
function calcNew(){
  const g = id => n($(id).value);
  const total = g('f-consult')+g('f-electrode')+g('f-treat')+g('f-additional');
  const paid = g('f-cash')+g('f-online'), bal = total-paid;
  $('f-total').value = money(total);
  $('f-paystatus').value = (total===0 && paid===0) ? '-' : bal>0 ? 'Pending (Rs. '+money(bal)+' due)' : 'Paid';
}
function readForm(){
  const g = id => $(id).value.trim();
  return {opdNo:g('f-opdNo'), regDate:g('f-regDate'), name:g('f-name'), mobNo:g('f-mobNo'), age:g('f-age'), address:g('f-address'), city:g('f-city'),
    gender:g('f-gender'), refBy:g('f-refBy'), refContact:g('f-refContact'), treatment:g('f-treatment'), dayNo:g('f-dayNo'), status:g('f-status'),
    diagnosis:$('f-diagnosis').value, patientHistory:$('f-patientHistory').value,
    consult:g('f-consult'), electrode:g('f-electrode'), treat:g('f-treat'), additional:g('f-additional'), cash:g('f-cash'), online:g('f-online')};
}
function validateForm(f, selfId){
  if(!f.name){ toast('Patient name is required'); return false; }
  if(!f.opdNo){ toast('OPD No. is required'); return false; }
  if(db.patients.some(p=>p.id!==selfId && String(p.opdNo)===f.opdNo)){ toast('OPD No. '+f.opdNo+' already exists'); return false; }
  if([f.consult,f.electrode,f.treat,f.additional,f.cash,f.online].some(v=>n(v)<0)){ toast('Amounts cannot be negative'); return false; }
  const total = n(f.consult)+n(f.electrode)+n(f.treat)+n(f.additional);
  if(n(f.cash)+n(f.online) > total && !confirm('Cash + Online is more than the Total Charges. Save anyway?')) return false;
  return true;
}
function visitFromForm(f, date){
  return newVisit({dayNo:f.dayNo, consult:f.consult, electrode:f.electrode, treatment:f.treat, additional:f.additional, cash:f.cash, online:f.online}, date);
}
function actSave(){
  const f = readForm();
  if(!validateForm(f, null)) return;
  const p = {id:uid(), opdNo:f.opdNo, regDate:f.regDate||todayStr(), name:f.name, mobNo:f.mobNo, age:f.age, gender:f.gender, address:f.address, city:f.city,
    refBy:f.refBy, refContact:f.refContact, treatment:f.treatment, status:f.status, diagnosis:f.diagnosis, patientHistory:f.patientHistory,
    createdBy:currentUser, visits:[visitFromForm(f, f.regDate||todayStr())]};
  db.patients.push(p);
  if(!saveDb()){ db.patients.pop(); return; }
  toast('Saved. OPD No. '+p.opdNo); editingId = null; render();
}
function actUpdate(){
  const p = db.patients.find(x=>x.id===editingId); if(!p) return;
  const f = readForm();
  if(!validateForm(f, p.id)) return;
  Object.assign(p, {opdNo:f.opdNo, regDate:f.regDate||p.regDate, name:f.name, mobNo:f.mobNo, age:f.age, gender:f.gender, address:f.address, city:f.city,
    refBy:f.refBy, refContact:f.refContact, treatment:f.treatment, status:f.status, diagnosis:f.diagnosis, patientHistory:f.patientHistory});
  const lv = lastVisit(p);
  Object.assign(lv, {dayNo:f.dayNo||lv.dayNo, consult:n(f.consult), electrode:n(f.electrode), treatment:n(f.treat), additional:n(f.additional)});
  setPaid(lv, n(f.cash), n(f.online));
  saveDb(); toast('Updated. OPD No. '+p.opdNo); editingId = null; render();
}
function actDelete(){
  const p = db.patients.find(x=>x.id===editingId); if(!p) return;
  if(!confirm('Delete OPD No. '+p.opdNo+' ('+p.name+') and all '+p.visits.length+' visit record(s)?\n\nThis cannot be undone. Save a backup first if unsure.')) return;
  db.patients = db.patients.filter(x=>x.id!==p.id);
  saveDb(); toast('Patient deleted'); editingId = null; render();
}

function revisitRows(){
  const list = db.patients.filter(p=>matchPatient(p,rvQ) && (rvFilter==='all' || p.status!=='Completed'))
    .sort((a,b)=>(parseInt(b.opdNo)||0)-(parseInt(a.opdNo)||0));
  if(!list.length) return `<tr><td colspan="9"><div class="empty-state"><b>No patients to show</b>Register a patient first, or change the filter.</div></td></tr>`;
  return list.slice(0,200).map(p=>{
    const lv = lastVisit(p), o = pOut(p);
    return `<tr><td>${esc(p.opdNo)}</td><td>${esc(p.name)}</td><td>${esc(p.mobNo)||'-'}</td><td>${esc(p.treatment)||'-'}</td><td>${esc(lv.dayNo)}</td><td>${fmtDate(lv.date)}</td>
      <td class="num">${money(vTotal(lv))}</td><td class="num">${o>0?`<span class="stamp due">${money(o)}</span>`:'0'}</td>
      <td><button class="btn btn-sm" data-act="visit-open" data-id="${esc(p.id)}">+ Add Visit</button></td></tr>`;
  }).join('');
}
function calcVisit(){
  const g = id => n($(id).value);
  const total = g('v-consult')+g('v-electrode')+g('v-treat')+g('v-additional');
  const paid = g('v-cash')+g('v-online'), bal = total-paid;
  $('v-total').value = money(total);
  $('v-paystatus').value = (total===0 && paid===0) ? '-' : bal>0 ? 'Pending (Rs. '+money(bal)+' due)' : 'Paid';
}
function actVisitSave(){
  const p = db.patients.find(x=>x.id===revisitFor); if(!p) return;
  const g = id => $(id).value.trim();
  const f = {dayNo:g('v-day'), consult:g('v-consult'), electrode:g('v-electrode'), treatment:g('v-treat'), additional:g('v-additional'), cash:g('v-cash'), online:g('v-online')};
  const date = g('v-date') || todayStr();
  if([f.consult,f.electrode,f.treatment,f.additional,f.cash,f.online].some(v=>n(v)<0)){ toast('Amounts cannot be negative'); return; }
  const total = n(f.consult)+n(f.electrode)+n(f.treatment)+n(f.additional);
  if(total===0 && !confirm('Total charges are 0. Save this visit anyway?')) return;
  if(n(f.cash)+n(f.online) > total && !confirm('Cash + Online is more than the Total Charges. Save anyway?')) return;
  if(p.visits.some(v=>v.date===date) && !confirm('This patient already has a visit on '+fmtDate(date)+'. Add another one?')) return;
  p.visits.push(newVisit(f, date));
  p.status = g('v-status');
  saveDb(); toast('Visit saved. '+p.name+', Day '+f.dayNo); revisitFor = null; render();
}

function pendRows(q){
  const rows = [];
  db.patients.filter(p=>matchPatient(p,q)).sort((a,b)=>(parseInt(a.opdNo)||0)-(parseInt(b.opdNo)||0))
    .forEach(p => p.visits.forEach(v => { if(vBal(v) > 0) rows.push({p,v}); }));
  const totalDue = rows.reduce((s,{v})=>s+vBal(v),0);
  setTimeout(()=>{ const s = $('pend-summary'); if(s) s.innerHTML = `<p style="margin:0 0 12px;font-size:13px"><b>${rows.length}</b> pending ${rows.length===1?'entry':'entries'} · Total due <b style="color:var(--red);font-family:var(--mono)">Rs. ${money(totalDue)}</b></p>`; }, 0);
  if(!rows.length) return `<tr><td colspan="14"><div class="empty-state"><b>All clear</b>No pending balances.</div></td></tr>`;
  return rows.map(({p,v},i)=>`<tr data-pid="${esc(p.id)}" data-vid="${esc(v.id)}" data-total="${vTotal(v)}">
    <td>${i+1}</td><td>${esc(p.opdNo)}</td><td>${esc(p.name)}</td><td>${esc(p.mobNo)||'-'}</td><td>${esc(v.dayNo)}</td><td>${fmtDate(v.date)}</td>
    <td class="num">${money(n(v.consult)+n(v.treatment))}</td><td class="num">${money(v.electrode)}</td><td class="num">${money(v.additional)}</td><td class="num">${money(vTotal(v))}</td>
    <td class="num"><input class="cell" type="number" min="0" step="any" data-pend="online" value="${vOnline(v)}"></td>
    <td class="num"><input class="cell" type="number" min="0" step="any" data-pend="cash" value="${vCash(v)}"></td>
    <td class="num bal"><span class="stamp due">${money(vBal(v))}</span></td>
    <td><button class="btn btn-sm" data-act="pend-save">Save</button></td></tr>`).join('');
}
function updatePendRow(tr){
  const total = n(tr.dataset.total);
  const on = n(tr.querySelector('[data-pend=online]').value), ca = n(tr.querySelector('[data-pend=cash]').value);
  const bal = total-on-ca;
  tr.querySelector('.bal').innerHTML = bal>0 ? `<span class="stamp due">${money(bal)}</span>` : `<span class="stamp paid">${bal<0?'Extra '+money(-bal):'Paid'}</span>`;
}
function actPendSave(tr){
  const p = db.patients.find(x=>x.id===tr.dataset.pid); if(!p) return;
  const v = p.visits.find(x=>x.id===tr.dataset.vid); if(!v) return;
  const on = n(tr.querySelector('[data-pend=online]').value), ca = n(tr.querySelector('[data-pend=cash]').value);
  if(on<0 || ca<0){ toast('Amounts cannot be negative'); return; }
  if(on+ca > vTotal(v) && !confirm('Cash + Online is more than the Total. Save anyway?')) return;
  setPaid(v, ca, on); saveDb();
  toast('Saved. '+p.name+', balance Rs. '+money(Math.max(0,vBal(v)))); render();
}

/* =====================================================================
   VIEW: REPORTS
   ===================================================================== */
function renderReports(){
  if(!repTo) repTo = todayStr();
  if(!repFrom) repFrom = repTo.slice(0,8)+'01';
  return `
  <div class="card"><h2>Reports</h2>
    <div class="inline">
      <div><label style="margin-top:0">From</label><input type="date" id="rep-from" value="${esc(repFrom)}"></div>
      <div><label style="margin-top:0">To</label><input type="date" id="rep-to" value="${esc(repTo)}"></div>
      <div><button class="btn btn-outline" data-act="rep-month">This Month</button></div>
      <div><button class="btn" data-act="rep-csv">Export Visits (Excel CSV)</button></div>
    </div>
    <div id="rep-out">${reportHtml()}</div>
  </div>`;
}
function reportData(){
  const days = {}, get = d => days[d] || (days[d] = {date:d, visits:0, newPat:0, billed:0, cash:0, online:0, due:0});
  const inR = d => d >= repFrom && d <= repTo;
  db.patients.forEach(p=>{
    if(inR(p.regDate)) get(p.regDate).newPat++;
    p.visits.forEach(v=>{ if(inR(v.date)){ const r = get(v.date); r.visits++; r.billed += vTotal(v); r.due += Math.max(0,vBal(v)); } });
  });
  allPayments().forEach(({x})=>{ if(inR(x.date)){ const r = get(x.date); r.cash += n(x.cash); r.online += n(x.online); } });
  return Object.values(days).sort((a,b)=>a.date<b.date?-1:1);
}
function reportHtml(){
  const rows = reportData();
  const t = rows.reduce((a,r)=>({visits:a.visits+r.visits,newPat:a.newPat+r.newPat,billed:a.billed+r.billed,cash:a.cash+r.cash,online:a.online+r.online,due:a.due+r.due}),{visits:0,newPat:0,billed:0,cash:0,online:0,due:0});
  return `<div class="pills">
    <div class="pill"><div class="lbl">New Patients</div><div class="val">${t.newPat}</div></div>
    <div class="pill"><div class="lbl">Visits</div><div class="val">${t.visits}</div></div>
    <div class="pill"><div class="lbl">Billed</div><div class="val">Rs. ${money(t.billed)}</div></div>
    <div class="pill"><div class="lbl">Collected</div><div class="val green">Rs. ${money(t.cash+t.online)}</div></div>
    <div class="pill"><div class="lbl">Still Pending (these visits)</div><div class="val red">Rs. ${money(t.due)}</div></div></div>
  ${rows.length ? `<div class="tablewrap"><table>
    <thead><tr><th>Date</th><th class="num">New Patients</th><th class="num">Visits</th><th class="num">Billed</th><th class="num">Cash</th><th class="num">Online</th><th class="num">Collected</th><th class="num">Pending</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td class="num">${r.newPat}</td><td class="num">${r.visits}</td><td class="num">${money(r.billed)}</td>
      <td class="num">${money(r.cash)}</td><td class="num">${money(r.online)}</td><td class="num">${money(r.cash+r.online)}</td><td class="num">${money(r.due)}</td></tr>`).join('')}</tbody></table></div>`
  : `<div class="empty-state"><b>No records in this period</b>Choose a different date range.</div>`}
  <p class="hint">Cash and Online show money actually received on that date. Billed and Pending are based on the visit date.</p>`;
}
function actRepCSV(){
  const rows = allVisitRows().filter(({v})=>v.date>=repFrom && v.date<=repTo);
  if(!rows.length){ toast('No visits in this date range'); return; }
  downloadFile('opd-visits-'+repFrom+'-to-'+repTo+'.csv', visitsCSV(rows), 'text/csv;charset=utf-8');
  toast('Excel (CSV) file saved');
}

/* =====================================================================
   VIEW: SETTINGS & BACKUP
   ===================================================================== */
function renderSettings(){
  const me = db.staff.find(s=>s.name===currentUser), admin = !!(me && me.admin);
  const info = window.desktopStore && window.desktopStore.info ? window.desktopStore.info() : null;
  return `
  <div class="card"><h2>Clinic</h2>
    <div class="inline"><div style="flex:1;min-width:240px"><label style="margin-top:0">Clinic Name (shown at the top)</label><input id="set-clinic" value="${esc(db.settings.clinic)}" ${admin?'':'readonly'}></div>
    ${admin?'<div><button class="btn" data-act="set-clinic">Save</button></div>':''}</div></div>

  <div class="card"><h2>Staff Logins</h2>
    ${db.staff.map(s=>{
      const can = admin || s.name===currentUser;
      return `<div class="staff-row"><span class="nm">${esc(s.name)} ${s.admin?'<span class="stamp paid" style="margin-left:6px">Admin</span>':''}</span>
        ${can?`<input type="password" inputmode="numeric" maxlength="6" data-pin placeholder="New PIN" id="np-${esc(s.name)}"><button class="btn btn-outline btn-sm" data-act="staff-pin" data-name="${esc(s.name)}">Set PIN</button>`:''}
        ${admin && s.name!==currentUser?`<button class="btn btn-danger btn-sm" data-act="staff-del" data-name="${esc(s.name)}">Remove</button>`:''}</div>`;
    }).join('')}
    ${admin?`<div class="inline" style="margin-top:16px"><div><label style="margin-top:0">New Staff Name</label><input id="ns-name"></div>
      <div><label style="margin-top:0">PIN (4-6 digits)</label><input id="ns-pin" type="password" inputmode="numeric" maxlength="6" data-pin></div>
      <div><button class="btn" data-act="staff-add">Add Staff</button></div></div>`
      :'<p class="hint">Only the admin can add or remove staff.</p>'}
  </div>

  <div class="card"><h2>Backup &amp; Export</h2>
    <p class="hint" style="margin-top:0">${db.patients.length} patients · ${db.patients.reduce((s,p)=>s+p.visits.length,0)} visits · ${db.staff.length} staff logins</p>
    ${info?`<p class="hint">Your data is stored in this folder, outside the app, so it stays safe if you uninstall or reinstall:<br><b>${esc(info.folder)}</b><br>A copy is saved automatically every day in the Backups folder inside it.</p>`
          :'<p class="hint">Your data is stored inside this browser on this computer. Save a backup file regularly.</p>'}
    <div class="btnrow" style="border-top:none;margin-top:10px;padding-top:0">
      <button class="btn" data-act="bk-save">Save Backup File</button>
      <button class="btn btn-outline" data-act="bk-csv">Export to Excel (CSV)</button>
      <button class="btn btn-outline" data-act="bk-restore">Restore From Backup</button>
      ${info?'<button class="btn btn-outline" data-act="bk-folder">Open Data Folder</button>':''}
      <input type="file" id="bk-file" accept=".json,application/json" style="display:none">
    </div>
  </div>`;
}
function actStaffPin(name){
  const inp = document.getElementById('np-'+name); const pin = inp ? inp.value.trim() : '';
  if(!/^\d{4,6}$/.test(pin)){ toast('PIN must be 4 to 6 digits'); return; }
  const s = db.staff.find(x=>x.name===name); if(!s) return;
  s.pin = pin; saveDb(); toast('PIN changed for '+name); render();
}
function actStaffDel(name){
  if(!confirm('Remove login for '+name+'?\nTheir past entries stay in the register.')) return;
  db.staff = db.staff.filter(x=>x.name!==name); saveDb(); toast('Removed '+name); render();
}
function actStaffAdd(){
  const name = $('ns-name').value.trim(), pin = $('ns-pin').value.trim();
  if(!name){ toast('Enter a staff name'); return; }
  if(!/^\d{4,6}$/.test(pin)){ toast('PIN must be 4 to 6 digits'); return; }
  if(db.staff.some(s=>s.name.toLowerCase()===name.toLowerCase())){ toast('That name already has a login'); return; }
  db.staff.push({name, pin, admin:false}); saveDb(); toast('Staff login created: '+name); render();
}
function importBackup(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.patients) || !Array.isArray(d.staff)) throw new Error('bad');
      if(!confirm('This will REPLACE all current data with the backup ('+d.patients.length+' patients). Continue?')) return;
      db = normalize(d); loadFailed = false; saveDb();
      toast('Backup restored. Please log in again.'); logout();
    }catch(e){ toast('That is not a valid backup file'); }
  };
  r.readAsText(file);
}
function exitAndBackup(){
  if(window.desktopStore && window.desktopStore.backupNow){
    window.desktopStore.backupNow(); toast('Backup saved'); setTimeout(()=>window.desktopStore.quit(), 500);
  } else { exportBackup(); setTimeout(logout, 400); }
}

/* =====================================================================
   RENDER + EVENTS
   ===================================================================== */
function render(){
  document.querySelectorAll('[data-menu]').forEach(b=>b.classList.toggle('active', b.dataset.menu===section));
  $('tabs').style.display = section==='reception' ? 'flex' : 'none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  let html;
  if(section==='reception') html = tab==='new' ? renderNew() : tab==='session' ? renderSession() : tab==='revisit' ? renderRevisit() : tab==='today' ? renderToday() : renderPending();
  else if(section==='reports') html = renderReports();
  else html = renderSettings();
  $('content').innerHTML = html;
  if($('f-total')) calcNew();
  if($('v-total')) calcVisit();
}

document.addEventListener('click', e=>{
  const m = e.target.closest('[data-menu]');
  if(m){
    if(m.dataset.menu==='exit'){ exitAndBackup(); return; }
    section = m.dataset.menu; revisitFor = null; render(); return;
  }
  const t = e.target.closest('.tab');
  if(t){ tab = t.dataset.tab; section = 'reception'; if(tab!=='revisit') revisitFor = null; if(tab!=='new') editingId = null; render(); return; }
  const a = e.target.closest('[data-act]');
  if(!a || a.disabled) return;
  switch(a.dataset.act){
    case 'addnew': case 'cancel': editingId = null; findQ = ''; render(); $('f-name') && $('f-name').focus(); break;
    case 'save': actSave(); break;
    case 'update': actUpdate(); break;
    case 'delete': actDelete(); break;
    case 'exit': logout(); break;
    case 'load': editingId = a.dataset.id; render(); window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'visit-open': revisitFor = a.dataset.id; render(); window.scrollTo({top:0, behavior:'smooth'}); break;
    case 'visit-save': actVisitSave(); break;
    case 'visit-cancel': revisitFor = null; render(); break;
    case 'tc-today': tcDate = todayStr(); render(); break;
    case 'pend-refresh': render(); break;
    case 'pend-save': actPendSave(a.closest('tr')); break;
    case 'rep-month': repTo = todayStr(); repFrom = repTo.slice(0,8)+'01'; render(); break;
    case 'rep-csv': actRepCSV(); break;
    case 'set-clinic': db.settings.clinic = $('set-clinic').value.trim(); saveDb(); refreshBrand(); toast('Clinic name saved'); break;
    case 'staff-pin': actStaffPin(a.dataset.name); break;
    case 'staff-del': actStaffDel(a.dataset.name); break;
    case 'staff-add': actStaffAdd(); break;
    case 'bk-save': exportBackup(); break;
    case 'bk-csv': exportCSV(); break;
    case 'bk-restore': $('bk-file').click(); break;
    case 'bk-folder': window.desktopStore.openFolder(); break;
  }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.matches('[data-mob]')) t.value = t.value.replace(/\D/g,'').slice(0,10);
  if(t.matches('[data-pin]')) t.value = t.value.replace(/\D/g,'').slice(0,6);
  if(t.matches('[data-calc="new"]')) calcNew();
  if(t.matches('[data-calc="visit"]')) calcVisit();
  if(t.id==='find-q'){ findQ = t.value; $('find-body').innerHTML = findRows(findQ); }
  if(t.id==='pend-q'){ pendQ = t.value; $('pend-body').innerHTML = pendRows(pendQ); }
  if(t.id==='rv-q'){ rvQ = t.value; $('rv-body').innerHTML = revisitRows(); }
  if(t.matches('[data-pend]')) updatePendRow(t.closest('tr'));
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.id==='rv-filter'){ rvFilter = t.value; $('rv-body').innerHTML = revisitRows(); }
  if(t.id==='tc-date'){ tcDate = t.value || todayStr(); render(); }
  if(t.id==='rep-from' || t.id==='rep-to'){
    repFrom = $('rep-from').value || repFrom; repTo = $('rep-to').value || repTo; $('rep-out').innerHTML = reportHtml();
  }
  if(t.id==='bk-file'){ if(t.files[0]) importBackup(t.files[0]); t.value = ''; }
});
$('login-btn').onclick = doLogin;
$('su-btn').onclick = doSetup;
$('logout-btn').onclick = logout;
$('login-pin').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('su-pin2').addEventListener('keydown', e=>{ if(e.key==='Enter') doSetup(); });

setInterval(()=>{
  const c = $('clock'); if(c && currentUser) c.textContent = '| Time: ' + new Date().toLocaleTimeString('en-IN');
}, 1000);

/* ---------- boot ---------- */
loadDb();
if(loadFailed){
  document.body.innerHTML = `<div class="fatal"><b>The data file could not be read.</b><br>
    To protect your records, the app has stopped without changing anything.<br><br>
    Please do not continue. Restore the latest copy from the <b>Backups</b> folder next to your data file, or contact support.</div>`;
} else {
  showLoginOrSetup();
}
</script>
