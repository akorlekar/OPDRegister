name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: OPD-Register-Windows
          path: |
            dist/OPD-Register-Setup.exe
            dist/OPD-Register-Portable.exe
      - name: Publish release (only when you push a tag like v2.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OPD-Register-Setup.exe
            dist/OPD-Register-Portable.exe
